<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ท่องเที่ยวเกาหลีใต้ — Korea Travel</title>
<style>
  :root{
    --red: #DD0303;
    --white: #ffffff;
    --muted: #f7f7f8;
    --text: #222;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter, system-ui, sans-serif}
  body{background:var(--muted); color:var(--text); -webkit-font-smoothing:antialiased;}

/* ===== Welcome / Memorial ===== */
.memorial{
  height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; text-align:center; background:linear-gradient(180deg,var(--white),#fff);
  padding:28px;
}
.memorial img{ width:340px; max-width:80%; border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,0.12); }
.memorial h1{ font-size:28px; color:var(--red); }
.memorial p{ max-width:720px; opacity:0.9; color:#333; }
.btn-primary{
  background:var(--red); color:var(--white); padding:12px 26px; border-radius:10px; border:none; cursor:pointer;
  font-weight:600; box-shadow:0 8px 24px rgba(221,3,3,0.18);
}
.btn-primary:hover{ transform:translateY(-3px); }

/* ===== top menu ===== */
nav{
  width:100%; background:var(--white); position:sticky; top:0; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,0.05);
  display:flex; gap:12px; align-items:center; justify-content:center; padding:12px 10px; display:none;
}
nav .nav-btn{ background:transparent; border:1px solid rgba(0,0,0,0.06); padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--red); font-weight:600;}
nav .nav-btn:hover{ background:#fff0f0; }

/* ===== container ===== */
.container{ max-width:1200px; margin:28px auto; padding:16px; }

/* ===== banner (fade) ===== */
.banner {
  position:relative; width:100%; max-width:1200px; height:360px; margin:0 auto 22px; border-radius:14px; overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,0.08); background:#000;
}
.banner .slide{
  position:absolute; inset:0; opacity:0; transition:opacity .9s ease;
  background-position:center; background-size:cover;
}
.banner .slide.active{ opacity:1; }
.banner .banner-text{
  position:absolute; left:28px; bottom:28px; color:#fff; background:rgba(0,0,0,0.42); padding:12px 16px; border-radius:10px; font-weight:700;
}

/* ===== search ===== */
.search-bar{ display:flex; justify-content:center; margin:10px 0 22px; }
.search-bar input{
  width:92%; max-width:880px; padding:12px 16px; border-radius:12px; border:1px solid rgba(0,0,0,0.06);
  background: var(--white); box-shadow:0 8px 24px rgba(0,0,0,0.03) inset; font-size:15px;
}

/* ===== gallery grid ===== */
.photo-list{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.card{ background:var(--white); border-radius:12px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,0.04); cursor:pointer; transition:transform .18s; }
.card:hover{ transform:translateY(-6px); }
.card img{ width:100%; height:200px; object-fit:cover; display:block; opacity:0; transform:translateY(18px); transition:opacity .45s ease, transform .45s ease; }
.card .card-body{ padding:12px; font-weight:700; color:var(--red); text-align:center; }

/* ===== viewer ===== */
#viewer{ display:none; padding:28px; text-align:center; max-width:1000px; margin:0 auto; }
#viewer img{ width:80%; max-width:820px; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.12); display:block; margin:0 auto; }
#viewer .text{ max-width:900px; margin:12px auto; text-align:left; background:var(--white); border-radius:10px; padding:16px; box-shadow:0 8px 30px rgba(0,0,0,0.04); color:#333; white-space:pre-line; }
.controls{ margin-top:12px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

/* ===== shop ===== */
#shopPage{ display:none; padding:18px; }
.shop-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.shop-item{ background:var(--white); border-radius:12px; padding:12px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.04); }
.shop-item img{ width:100%; height:200px; object-fit:cover; border-radius:8px; }
.shop-item h4{ color:var(--red); margin-top:10px; }
.shop-item p{ color:#444; margin:8px 0; }
.shop-item button{ background:var(--red); color:var(--white); border:none; padding:8px 14px; border-radius:8px; cursor:pointer; }

/* ===== tours ===== */
#tourPage{ display:none; padding:18px; }
.tour-list{ max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.tour-card{ background:var(--white); padding:14px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.04); }

/* ===== responsive ===== */
@media (max-width:900px){
  .photo-list{ grid-template-columns:repeat(2,1fr); }
  .shop-grid{ grid-template-columns:repeat(2,1fr); }
  .banner{ height:260px; }
}
@media (max-width:600px){
  .photo-list{ grid-template-columns:1fr; }
  .shop-grid{ grid-template-columns:1fr; }
  .banner{ height:180px; }
  #viewer img{ width:94%; }
}
</style>
</head>
<body>

<!-- Welcome / Memorial -->
<section class="memorial" id="memorial">
  <img src="tribute.jpg" alt="tribute">
  <h1>ขอไว้อาลัย</h1>
  <p>ใส่ข้อความไว้อาลัยที่ต้องการที่นี่ — สามารถแก้เป็นข้อความของคุณได้ทันที</p>
  <button class="btn-primary" id="enterBtn">เข้าสู่เว็บไซต์</button>
</section>

<!-- Top menu -->
<nav id="menuBar" aria-label="เมนูหลัก">
  <button class="nav-btn" id="navHome">หน้าแรก</button>
  <button class="nav-btn" id="navGallery">สถานที่ท่องเที่ยว</button>
  <button class="nav-btn" id="navShop">ร้านค้า</button>
  <button class="nav-btn" id="navTours">แพ็กเกจทัวร์</button>
</nav>

<!-- Main content -->
<main class="container" id="mainSite" style="display:none;">

  <!-- Banner -->
  <div class="banner" id="banner">
    <div class="slide" style="background-image:url('banner1.jpg')"></div>
    <div class="slide" style="background-image:url('banner2.jpg')"></div>
    <div class="slide" style="background-image:url('banner3.jpg')"></div>
    <div class="banner-text">ยินดีต้อนรับสู่เกาหลีใต้</div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <input id="searchInput" placeholder="ค้นหาสถานที่ (พิมพ์ชื่อแล้วกรองอัตโนมัติ)">
  </div>

  <!-- Gallery -->
  <section id="galleryPage">
    <h2 style="text-align:center;margin-bottom:12px;color:var(--red);">สถานที่ท่องเที่ยวเกาหลีใต้</h2>
    <div class="photo-list" id="photoList"></div>
  </section>

  <!-- Quick link to tours -->
  <section style="margin-top:18px;text-align:center;">
    <button class="btn-primary" id="goTours">ดูแพ็กเกจทัวร์</button>
  </section>

</main>

<!-- Viewer / Detail -->
<section id="viewer">
  <img id="viewerImg" alt="รูปใหญ่">
  <div class="text" id="viewerText"></div>
  <div class="controls">
    <button class="btn-primary" id="btnBack">ย้อนกลับ</button>
    <button class="btn-primary" id="btnToShop">ไปหน้าร้านค้า</button>
    <button class="btn-primary" id="btnToTours">ไปหน้าแพ็กเกจทัวร์</button>
  </div>
</section>

<!-- Shop Page -->
<section id="shopPage" style="display:none;">
  <div class="container">
    <h2 style="text-align:center;color:var(--red);margin-bottom:14px;">ร้านค้าของฝากเกาหลี</h2>
    <div class="shop-grid" id="shopGrid"></div>
    <div style="text-align:center;margin-top:18px;"><button class="btn-primary" id="backFromShop">กลับสู่แกลเลอรี่</button></div>
  </div>
</section>

<!-- Tours Page -->
<section id="tourPage" style="display:none;">
  <div class="container">
    <h2 style="text-align:center;color:var(--red);margin-bottom:14px;">แพ็กเกจทัวร์</h2>
    <div class="tour-list" id="tourList"></div>
    <div style="text-align:center;margin-top:18px;"><button class="btn-primary" id="backFromTours">กลับสู่แกลเลอรี่</button></div>
  </div>
</section>

<script>
/* ===== element refs ===== */
const memorialEl = document.getElementById('memorial');
const enterBtn = document.getElementById('enterBtn');
const menuBar = document.getElementById('menuBar');
const mainSite = document.getElementById('mainSite');
const bannerEl = document.getElementById('banner');
const photoList = document.getElementById('photoList');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerText = document.getElementById('viewerText');
const btnBack = document.getElementById('btnBack');
const btnToShop = document.getElementById('btnToShop');
const btnToTours = document.getElementById('btnToTours');
const shopPage = document.getElementById('shopPage');
const shopGrid = document.getElementById('shopGrid');
const tourPage = document.getElementById('tourPage');
const tourList = document.getElementById('tourList');
const searchInput = document.getElementById('searchInput');
const navHome = document.getElementById('navHome');
const navGallery = document.getElementById('navGallery');
const navShop = document.getElementById('navShop');
const navTours = document.getElementById('navTours');
const goToursBtn = document.getElementById('goTours');
const backFromShop = document.getElementById('backFromShop');
const backFromTours = document.getElementById('backFromTours');

/* ===== data: 21 places (Korea) ===== */
const places = [
`โซล (Seoul)
เมืองหลวงของเกาหลีใต้ แหล่งช้อปปิ้ง วัฒนธรรม และประวัติศาสตร์ พร้อมสถานที่สำคัญเช่น พระราชวังเคียงบกกุง และหมู่บ้านบุกชอนฮันอก`,

`ปูซาน (Busan)
เมืองท่าสำคัญริมทะเล มีชายหาดยอดนิยมอย่าง Haeundae และตลาดปลา Jagalchi`,

`เกาะเชจู (Jeju Island)
เกาะสวยตามธรรมชาติ มีภูเขาไฟ ยอนนัมจอง และชายหาดที่สวยงาม`,

`คลองชองกเยชอน (Cheonggyecheon)
ลำธารใจกลางกรุงโซล เหมาะสำหรับเดินเล่นและชมไฟในช่วงกลางคืน`,

`พระราชวังเคียงบกกุง (Gyeongbokgung)
พระราชวังหลักของราชวงศ์โชซอน มีสถาปัตยกรรมงดงามและพิพิธภัณฑ์`,

`หมู่บ้านบุกชอนฮันอก (Bukchon Hanok Village)
หมู่บ้านบ้านเรือนไม้แบบเกาหลีโบราณ เหมาะแก่การถ่ายภาพและเรียนรู้วัฒนธรรม`,

`ทงแดมุน (Dongdaemun)
ย่านแฟชั่นและการออกแบบ มี Dongdaemun Design Plaza (DDP)`,

`ฮงแด (Hongdae)
ย่านวัยรุ่นที่เต็มไปด้วยคาเฟ่ ศิลปะ และการแสดงถนน`,

`กังนัม (Gangnam)
ย่านทันสมัย มีร้านค้าและสถานบันเทิงระดับหรู (จากเพลงดัง Gangnam Style)`,

`นามิ (Nami Island)
เกาะโรแมนติกที่มีทิวทัศน์สวยงามโดยเฉพาะฤดูใบไม้เปลี่ยนสี`,

`หอคอยโซล N Tower (N Seoul Tower)
จุดชมวิวเมืองโซล ยอดนิยมสำหรับการชมวิวและล็อกคู่รัก`,

`ตลาดเมียงดง (Myeongdong)
แหล่งช้อปปิ้งและสตรีทฟู้ดที่มีชื่อเสียง`,

`คยองจู (Gyeongju)
เมืองมรดกทางประวัติศาสตร์ เต็มไปด้วยวัดและโบราณสถาน`,

`หาดแฮอึนแด (Haeundae, Busan)
ชายหาดยอดนิยมของปูซาน เหมาะสำหรับวันพักผ่อนริมทะเล`,

`วัดแฮดงยงกุงซา (Haedong Yonggungsa)
วัดริมทะเลที่มีทิวทัศน์งดงาม`,

`ซองโด (Songdo, Incheon)
เมืองสมาร์ทและทันสมัย มีสถาปัตยกรรมร่วมสมัยและพื้นที่สีเขียว`,

`สวนสนุกล็อตเต้เวิลด์ (Lotte World)
สวนสนุกในร่มและบริเวณรอบนอกที่เหมาะกับครอบครัว`,

`ป้อมฮวาซอง (Hwaseong Fortress, Suwon)
ป้อมโบราณที่ได้รับการขึ้นทะเบียนเป็นมรดกโลก`,

`สวนสาธารณะโซลฟอเรสต์ (Seoul Forest)
สวนขนาดใหญ่ เหมาะสำหรับการปิกนิกและพักผ่อน`,

`อุทยานแห่งชาติซอรัคซาน (Seoraksan)
ภูเขาที่งดงาม เหมาะสำหรับปีนเขาและชมวิวธรรมชาติ`,

`DMZ & พิพิธภัณฑ์สันติภาพ (DMZ)
พื้นที่ชายแดนเพื่อเรียนรู้ประวัติศาสตร์และสภาพการแบ่งแยกของคาบสมุทร`
];

/* ===== shop items (8 ตัวอย่าง) ===== */
const shopItems = [
  { name: "โสมแดงเกาหลี (Red Ginseng)", img: "shop1.jpg", price: "890 บาท", desc: "โสมแดงคุณภาพสูง ผลิตในเกาหลี" },
  { name: "มาส์กหน้า K-Beauty (5 ชิ้น)", img: "shop2.jpg", price: "220 บาท", desc: "มาส์กหน้าบำรุงชุ่มชื้น" },
  { name: "อัลบั้ม K-POP", img: "shop3.jpg", price: "690 บาท", desc: "อัลบั้มศิลปินยอดนิยม พร้อมแผ่นโปสเตอร์" },
  { name: "เครื่องประดับฮันบก (ของที่ระลึก)", img: "shop4.jpg", price: "350 บาท", desc: "เครื่องประดับงานฝีมือแบบเกาหลี" },
  { name: "ชุดพวงกุญแจแลนด์มาร์ก", img: "shop5.jpg", price: "150 บาท", desc: "พวงกุญแจสะสมจากสถานที่ต่างๆ" },
  { name: "ชาโสม (Ginseng Tea)", img: "shop6.jpg", price: "240 บาท", desc: "ชาโสมกลิ่นละมุนเพื่อสุขภาพ" },
  { name: "โปสการ์ดเกาหลี 10 ใบ", img: "shop7.jpg", price: "120 บาท", desc: "เซ็ตโปสการ์ดสถานที่ดังของเกาหลี" },
  { name: "หมวกแฟชั่นเกาหลี", img: "shop8.jpg", price: "320 บาท", desc: "หมวกสไตล์เกาหลี เดินเที่ยวสวยๆ" }
];

/* ===== tours (3 แบบ) ===== */
const tours = [
  { title: "ทัวร์โซล 3 วัน 2 คืน", days: "3 วัน 2 คืน", price: "9,500 บาท", desc: "เที่ยวพระราชวัง, ตลาด, หอ N" },
  { title: "ทัวร์ปูซาน 4 วัน 3 คืน", days: "4 วัน 3 คืน", price: "12,800 บาท", desc: "ชายหาด Haeundae, ตลาด Jagalchi" },
  { title: "ทัวร์เชจู 5 วัน 4 คืน", days: "5 วัน 4 คืน", price: "15,900 บาท", desc: "ธรรมชาติบนเกาะเชจู และกิจกรรมกลางแจ้ง" }
];

/* ===== render functions ===== */
function renderGallery(){
  photoList.innerHTML = '';
  places.forEach((txt, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = idx;
    // select image filename mapping (user should provide these files in image/)
    const imgNames = [
      'seoul.jpg','busan.jpg','jeju.jpg','cheonggyecheon.jpg','gyeongbokgung.jpg','bukchon.jpg','dongdaemun.jpg',
      'hongdae.jpg','gangnam.jpg','nami.jpg','ntower.jpg','myeongdong.jpg','gyeongju.jpg','haeundae.jpg',
      'haedong.jpg','songdo.jpg','lotteworld.jpg','hwaseong.jpg','seoulforest.jpg','seoraksan.jpg','dmz.jpg'
    ];
    const img = document.createElement('img');
    img.src = 'image/' + (imgNames[idx] || 'placeholder.jpg');
    img.alt = (txt.split('\n')[0] || `สถานที่ ${idx+1}`);
    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerText = img.alt;
    card.appendChild(img);
    card.appendChild(body);
    card.addEventListener('click', ()=> openViewer(idx));
    photoList.appendChild(card);
  });
}

function renderShop(){
  shopGrid.innerHTML = '';
  shopItems.forEach(it=>{
    const box = document.createElement('div');
    box.className = 'shop-item';
    box.innerHTML = `<img src="image/${it.img}" alt="${it.name}"><h4>${it.name}</h4><p>${it.desc}</p><p style="font-weight:700;color:var(--red)">${it.price}</p><button onclick="alert('สั่งซื้อทดลอง: ${it.name} — ${it.price}')">สั่งซื้อ</button>`;
    shopGrid.appendChild(box);
  });
}

function renderTours(){
  tourList.innerHTML = '';
  tours.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'tour-card';
    card.innerHTML = `<h3 style="color:var(--red)">${t.title}</h3><p>${t.days} — ${t.price}</p><p>${t.desc}</p><div style="margin-top:10px;"><button onclick="alert('จองทัวร์ทดลอง: ${t.title} — ${t.price}')">จองทัวร์</button></div>`;
    tourList.appendChild(card);
  });
}

/* ===== banner crossfade logic ===== */
let bannerIndex = 0;
let bannerTimer = null;
const bannerSlides = Array.from(bannerEl.querySelectorAll('.slide'));
function startBanner(){
  bannerSlides.forEach((s,i)=> s.classList.toggle('active', i === bannerIndex));
  stopBanner();
  bannerTimer = setInterval(()=> {
    bannerIndex = (bannerIndex + 1) % bannerSlides.length;
    bannerSlides.forEach((s,i)=> s.classList.toggle('active', i === bannerIndex));
  }, 3000);
  bannerEl.addEventListener('mouseenter', ()=> clearInterval(bannerTimer));
  bannerEl.addEventListener('mouseleave', ()=> startBanner());
}
function stopBanner(){ if(bannerTimer) clearInterval(bannerTimer); }

/* ===== viewer / navigation ===== */
function openViewer(idx){
  const txt = places[idx] || '';
  const imgs = document.querySelectorAll('.card img');
  viewerImg.src = imgs[idx]?.src || 'image/placeholder.jpg';
  viewerText.innerText = txt;
  mainSite.style.display = 'none';
  shopPage.style.display = 'none';
  tourPage.style.display = 'none';
  menuBar.style.display = 'flex';
  viewer.style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function backToGallery(){
  viewer.style.display = 'none';
  shopPage.style.display = 'none';
  tourPage.style.display = 'none';
  mainSite.style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== search filter ===== */
searchInput.addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    const name = (card.querySelector('.card-body')?.innerText || '').toLowerCase();
    card.style.display = !q || name.includes(q) ? '' : 'none';
  });
});

/* ===== page openers ===== */
function openGallery(){ mainSite.style.display='block'; shopPage.style.display='none'; tourPage.style.display='none'; viewer.style.display='none'; window.scrollTo({top:0}); }
function openShop(){ mainSite.style.display='none'; shopPage.style.display='block'; tourPage.style.display='none'; viewer.style.display='none'; window.scrollTo({top:0}); }
function openTours(){ mainSite.style.display='none'; shopPage.style.display='none'; tourPage.style.display='block'; viewer.style.display='none'; window.scrollTo({top:0}); }

/* ===== start site ===== */
function startSite(){
  memorialEl.style.display = 'none';
  menuBar.style.display = 'flex';
  mainSite.style.display = 'block';
  renderGallery();
  renderShop();
  renderTours();
  startBanner();
  // animate thumbnails in
  setTimeout(()=> {
    document.querySelectorAll('.card img').forEach((img,i)=> {
      img.style.opacity = 0; img.style.transform = 'translateY(18px)';
      setTimeout(()=> { img.style.opacity = 1; img.style.transform='translateY(0)'; }, 80*i);
    });
  }, 120);
}

/* ===== event bindings ===== */
enterBtn.addEventListener('click', startSite);
btnBack.addEventListener('click', backToGallery);
btnToShop.addEventListener('click', openShop);
btnToTours.addEventListener('click', openTours);
navHome.addEventListener('click', ()=> { location.reload(); });
navGallery.addEventListener('click', openGallery);
navShop.addEventListener('click', openShop);
navTours.addEventListener('click', openTours);
goToursBtn.addEventListener('click', openTours);
backFromShop.addEventListener('click', openGallery);
backFromTours.addEventListener('click', openGallery);

/* ===== initial render (keep memorial visible) ===== */
document.addEventListener('DOMContentLoaded', ()=>{
  renderGallery();
  renderShop();
  renderTours();
  // do not start banner until enter
});
</script>
